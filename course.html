<!DOCTYPE html>
<html>
<head>
  <title>My Notes & Books</title>

  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f4f6f8;
      margin: 0;
      padding: 0;
    }

    header {
      background: #2c3e50;
      color: white;
      text-align: center;
      padding: 20px;
    }

    .container {
      width: 90%;
      max-width: 800px;
      margin: 20px auto;
    }

    .section {
      background: white;
      padding: 20px;
      margin-bottom: 20px;
      border-radius: 10px;
      box-shadow: 0 2px 5px rgba(0,0,0,0.1);
    }

    h2 {
      border-bottom: 2px solid #ddd;
      padding-bottom: 5px;
    }

    .note {
      background: #eef2f7;
      padding: 10px;
      margin: 10px 0;
      border-left: 4px solid #3498db;
      border-radius: 5px;
    }

    .book {
      padding: 10px;
      margin: 10px 0;
      background: #f9f9f9;
      border-left: 4px solid #27ae60;
      border-radius: 5px;
    }

    .book a {
      text-decoration: none;
      color: #2c3e50;
      font-weight: bold;
    }

    .book a:hover {
      color: #27ae60;
    }
  </style>
</head>

<body>

<header>
  <h1>My Notes & Books</h1>
</header>

<div class="container">

  <!-- NOTES SECTION -->
  <div class="section">
    <h2>📒 Notes</h2>

    <div class="note">
      HTML is used to structure a webpage.
    </div>

    <div class="note">
      CSS is used to design and style the webpage.
    </div>

    <div class="note">
      Practice coding every day to improve.
    </div>

  </div>

  <!-- BOOKS SECTION -->
  <div class="section">
    <h2>📚 Books</h2>

    <div class="book">
      <a href="#">Introduction to Programming</a>
    </div>

    <div class="book">
      <a href="#">Learn HTML & CSS</a>
    </div>

    <div class="book">
      <a href="#">Web Development Basics</a>
    </div>

  </div>

</div>

</body>
</html>
