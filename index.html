<!DOCTYPE html>
<html>
<head>
<title>Loading</title>

<style>
body{
    height:100vh;
    display: flex;
    justify-content:center;
    align-items:center;
    background-color: black;
    background-image:
    repeating-linear-gradient(
        45deg,
        white 0px,
        white 2px,
        transparent 2px,
        transparent 4px
    );
}

.container{
    text-align:center;
    color:white;
    font-size:20px;
}

.loader{
    width: 50px;
    height: 50px;
    border:5px solid white;
    border-top:5px solid green;
    border-radius: 500px;
    animation:spin 1s linear infinite;
    margin:auto;
}

@keyframes spin{
    from{
        transform:rotate(0deg);
    }
    to{
        transform:rotate(360deg);
    }
}

</style>

</head>

<body>

<div class="container">

<div class="loader"></div>

<p>Please wait...</p>

</div>


<script>

setTimeout(function(){
    window.location.href="loginpage.html";

},5000);

</script>


</body>
</html>
